<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FitZone | Register</title><link rel="stylesheet" href="register.css"></head><body><header><h1>Membership Registration</h1><p>Practice HTML forms and built-in validation</p></header><nav class="nav"><a href="index.html">Home</a><a href="media.html">Media</a><a href="register.html">Register</a><a href="services.html">Services</a><a href="portfolio.html">Portfolio</a><a href="contact.html">Contact</a></nav><main><form action="#" method="get"><fieldset><legend>Personal Information</legend><label for="fullname">Full Name *</label><input id="fullname" name="fullname" type="text" minlength="3" maxlength="40" placeholder="Your full name" required><label for="email">Email *</label><input id="email" name="email" type="email" required><label for="password">Create Password *</label><input id="password" name="password" type="password" minlength="8" required><label for="birth">Date of Birth</label><input id="birth" name="birth" type="date"><label for="website">Website (optional)</label><input id="website" name="website" type="url" placeholder="https://example.com"><label for="color">Favorite Theme Color</label><input id="color" name="color" type="color" value="#167d6a"><label for="age">Age (18–70)</label><input id="age" name="age" type="number" min="18" max="70"><label for="time">Preferred Workout Time</label><input id="time" name="time" type="time"><label for="intensity">Preferred Intensity</label><input id="intensity" name="intensity" type="range" min="1" max="10" value="5"><label for="goal">Your Fitness Goal</label><textarea id="goal" name="goal" rows="4" maxlength="250"></textarea><label for="plan">Membership Plan</label><select id="plan" name="plan"><option value="" selected disabled>Select a plan</option><option value="basic">Basic</option><option value="standard">Standard</option><option value="premium">Premium</option></select><label for=
